# The test job for one box. Made from the box's settings by taskbox (template show test-job, or
# template apply on the controller): don't edit the copy in your repo. It asks the box for one tiny
# job per kind of VM, so on a quiet day the hourly box check still has a job to watch: if the box is
# dead, the test job waits, and the hourly box check fails. Each one takes a VM slot for a few
# minutes. It uses no hosted minutes, holds no secret and gets no token.
name: taskbox test job (__BOX__)
run-name: taskbox test job __BOX__ __FINGERPRINT__

on:
__SCHEDULE__
  workflow_dispatch:

permissions: {}

jobs:
  canary:
    strategy:
      fail-fast: false
      matrix:
        label: __LABELS__
    runs-on: ${{ matrix.label }}
    timeout-minutes: 15
    # At most two per label at once: the first waits for the box and keeps its age, which the hourly
    # box check sees; a newer one takes the place of the second, so a dead box never piles them up.
    concurrency:
      group: taskbox-canary-__BOX__-${{ matrix.label }}
      cancel-in-progress: false
    steps:
      - run: echo ok
