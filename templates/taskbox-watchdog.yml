# The hourly box check for one box. Made from the box's settings by taskbox (template show box-check,
# or template apply on the controller): don't edit the copy in your repo. It runs on a GitHub-hosted
# runner, so it works when the box is dead, and GitHub emails you when a run fails: jobs for the box
# waiting with no hold, the box held too long, a workspace request waiting too long, a hold variable
# out of shape, or GitHub's API out of reach on 3 runs in a row. The hold is one repository variable
# that only your controller writes; it runs out by itself. Values reach the script through env only.
# It needs no secret and only reads this repo. It warns when another box's check here names one of
# this box's labels. Its run name carries the settings' fingerprint for taskbox check --away.
name: taskbox hourly box check (__BOX__)
run-name: taskbox hourly box check __BOX__ __FINGERPRINT__${{ inputs.test_alert && ' (test alert)' || '' }}

on:
__SCHEDULE__
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Fail on purpose, to check GitHub emails you"
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: taskbox-box-check-__BOX__
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOX: "__BOX__"
      LABELS: "__LABELS__"
      WAIT_MINUTES: "__WAIT__"
      LEASE_HOURS: "__LEASE__"
      HOLD_ALARM_HOURS: "__HOLDALARM__"
      REQUEST_MINUTES: "__REQUEST__"
      UNREACHED_SPAN: "__SPAN__"
      HOLD: ${{ vars.__HOLDVAR__ }}
      TEST_ALERT: ${{ inputs.test_alert || false }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      # Runs in a row that couldn't read GitHub's API, kept in the Actions cache between runs.
      COUNT_DIR: .taskbox-box-check-__BOX__
      # A job asks for the box when one of its labels is one of the box's. GitHub matches labels
      # without regard to case, and so does this.
      BOX_JOBS: |
        [.jobs[] | select(any(.labels[]; ascii_downcase as $l | $labels | map(ascii_downcase) | index($l)))]
      # One indented line for each queued job for the box that has waited too long. A job's name is
      # anyone's text, so it never starts a line and holds printable characters only.
      LATE_JOBS: |
        def clean: tostring | gsub("[^ -~]"; "") | .[0:100];
        .[] | select(.status == "queued")
        | ($now - (.created_at | fromdateiso8601)) as $s
        | select($s > $wait * 60)
        | "  - \(.name | clean) has waited \($s / 60 | floor) min for \(.labels | join(", ") | clean)"
      # The hold, as one line of fields. none: no variable. bad: a variable that isn't this box's
      # lease (out of shape, another box's, dated ahead of now, or further ahead than the lease).
      # expired: a lease nobody ended. current: the minutes it has stood, the minutes a request has
      # waited (-1 for none), when it began and why.
      READ_HOLD: |
        def t: if type == "string" then (try fromdateiso8601 catch null) else null end;
        def clean: tostring | gsub("[^ -~]"; "") | .[0:80];
        if . == "" then "none" else
        (try fromjson catch null) as $h
        | if ($h | type) != "object" or $h.box != $box then "bad"
          else ($h.until | t) as $until | ($h.at | t) as $at | ($h.since | t) as $since
          | if $until == null or $at == null or $since == null then "bad"
            elif $at > $now + 300 or $since > $now + 300 or $since > $at + 300 or $until - $at > $lease * 3600 or $until - $now > $lease * 3600 then "bad"
            elif $until <= $now then "expired"
            else ($h.waitingSince | t) as $ws | ($h.waitingUntil | t) as $wu
            | (if $ws != null and $wu != null and $wu > $now and $wu - $at <= 7200 and $ws <= $now then ($now - $ws) / 60 | floor else -1 end) as $waited
            | "current\t\(($now - $since) / 60 | floor)\t\($waited)\t\($since | strftime("%H:%M UTC on %d %b"))\t\($h.why // "" | clean)"
            end
          end
        end
    steps:
      - name: Runs in a row that couldn't read GitHub's API
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .taskbox-box-check-__BOX__
          key: taskbox-box-check-__BOX__-${{ github.run_id }}
          restore-keys: taskbox-box-check-__BOX__-
      - name: The box
        shell: bash
        run: |
          set -uo pipefail
          set -f
          if [ "$TEST_ALERT" = "true" ]; then
            echo "A test alert: this run fails on purpose. If GitHub emails you about it, the hourly box check can reach you."
            exit 1
          fi
          now=$(date -u +%s)
          failed=0
          mkdir -p "$COUNT_DIR"
          count=$(cat "$COUNT_DIR/unreached" 2>/dev/null || echo 0)
          case "$count" in ''|*[!0-9]*) count=0 ;; esac
          hold=$(printf '%s' "${HOLD:-}" | jq -rRs --argjson now "$now" --argjson lease "$LEASE_HOURS" --arg box "$BOX" "$READ_HOLD" 2>/dev/null) || hold=bad
          IFS=$'\t' read -r state held_min waited_min since why <<< "$hold"
          case "$state" in
            bad)
              echo "The hold variable for $BOX isn't one its controller writes: out of shape, another box's, dated ahead, or past its $LEASE_HOURS hour lease. It counts as no hold. From the controller: type taskbox status, and delete the variable if no hold is meant."
              failed=1 ;;
            current)
              echo "$BOX is held${why:+ ($why)} since $since."
              if [ "$held_min" -gt $(( HOLD_ALARM_HOURS * 60 )) ]; then
                echo "$BOX has been held since $since${why:+ ($why)}, over $HOLD_ALARM_HOURS hours. From the controller: type taskbox status, then resume the box or end the workspace."
                failed=1
              fi
              if [ "$waited_min" -gt "$REQUEST_MINUTES" ]; then
                echo "A workspace request on $BOX has waited $waited_min minutes. From the controller: type taskbox, then approve or deny it."
                failed=1
              fi ;;
          esac
          unreached() {
            count=$(( count + 1 ))
            echo "$count" > "$COUNT_DIR/unreached"
            if [ "$count" -ge 3 ]; then
              echo "The hourly box check couldn't reach the box for $UNREACHED_SPAN: GitHub's API didn't answer on $count runs in a row."
              exit 1
            fi
            echo "::warning::GitHub's API didn't answer, so nothing is known about the box this time ($count in a row)."
            exit "$failed"
          }
          labels=$(printf '%s\n' $LABELS | jq -R . | jq -s .)
          jobs="$RUNNER_TEMP/jobs.json"
          echo '[]' > "$jobs"
          for status in queued in_progress; do
            runs=$(gh api --paginate "repos/$REPO/actions/runs?status=$status&per_page=100" --jq '.workflow_runs[].id') || unreached
            for run in $runs; do
              page=$(gh api --paginate "repos/$REPO/actions/runs/$run/jobs?per_page=100") || unreached
              printf '%s' "$page" | jq -s --argjson labels "$labels" "[.[] | $BOX_JOBS] | add // []" > "$RUNNER_TEMP/these.json" || unreached
              jq -s 'add' "$jobs" "$RUNNER_TEMP/these.json" > "$RUNNER_TEMP/all.json" && mv "$RUNNER_TEMP/all.json" "$jobs"
            done
          done
          echo 0 > "$COUNT_DIR/unreached"
          # Another box's check that names one of this box's labels: that box can take this one's jobs.
          # This box's test job asks for its own label, so its death still alarms, and you are told.
          for f in $(gh api "repos/$REPO/contents/.github/workflows" --jq '.[].name' 2>/dev/null | grep -E '^taskbox-watchdog-[a-z0-9-]+\.yml$' || true); do
            [ "$f" = "taskbox-watchdog-$BOX.yml" ] && continue
            theirs=$(gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/.github/workflows/$f" 2>/dev/null | sed -n 's/^      LABELS: "\([A-Za-z0-9._ -]*\)"$/\1/p' | tr 'A-Z' 'a-z')
            for l in $(printf '%s' "$LABELS" | tr 'A-Z' 'a-z'); do
              case " $theirs " in *" $l "*) echo "::warning::$f also names $l, so that box can take $BOX's jobs for it. Give each box labels of its own." ;; esac
            done
          done
          late=$(jq -r --argjson now "$now" --argjson wait "$WAIT_MINUTES" "$LATE_JOBS" "$jobs")
          if [ -n "$late" ] && [ "$state" != "current" ]; then
            echo "Jobs are waiting and $BOX isn't taking them: over $WAIT_MINUTES minutes, with no hold current. The box may be off, asleep, at the FileVault screen, offline, or short of slots."
            if [ "$state" = "expired" ]; then echo "The hold ran out while the controller was away: nothing renewed or ended it."; fi
            printf 'From the controller, type taskbox status.\n%s\n' "$late"
            exit 1
          fi
          if [ -n "$late" ]; then
            echo "Jobs for $BOX have waited over $WAIT_MINUTES minutes, and it is held, so they wait for the hold to end."
          else
            echo "No job for $BOX has waited over $WAIT_MINUTES minutes."
          fi
          exit "$failed"
      - name: Keep the count
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .taskbox-box-check-__BOX__
          key: taskbox-box-check-__BOX__-${{ github.run_id }}-${{ github.run_attempt }}
