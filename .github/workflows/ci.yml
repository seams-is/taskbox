# taskbox's own CI: the test suite on macOS and the typecheck on Linux, on GitHub-hosted runners.
# A box never runs this repo's jobs. No secrets, read-only token, every action pinned by commit SHA.
# Bun is fetched from its release by version and checked against its SHA-256. The macOS pin is the
# one versions.json pins for the box (test/install.test.ts checks they match).

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.4.4'

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      BUN_ZIP: bun-darwin-aarch64
      BUN_SHA256: c240d7f0ccb90c263a849fcdb09b7ee62630d921348ed6aafda86b9d577bc510
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Fetch and check bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/${BUN_ZIP}.zip"
          echo "$BUN_SHA256  $RUNNER_TEMP/bun.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$BUN_ZIP" >> "$GITHUB_PATH"
      - run: bun --version
      - run: bun install --frozen-lockfile
      - run: bun test

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUN_ZIP: bun-linux-x64
      BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Fetch and check bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/${BUN_ZIP}.zip"
          echo "$BUN_SHA256  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$BUN_ZIP" >> "$GITHUB_PATH"
      - run: bun --version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
